name: PlatformIO CI

on:
  workflow_dispatch: null
  push:
    branches:
      - master
    tags:
      - 'release/*'
  pull_request:
    types: [assigned, opened, synchronize, reopened]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Cache PlatformIO
      uses: actions/cache@v4
      with:
        path: ~/.platformio
        key: ${{ runner.os }}-${{ hashFiles('**/lockfiles') }}
    - name: Set up Python
      uses: actions/setup-python@v5
    - name: Install PlatformIO
      run: |
        python -m pip install --upgrade pip
        pip install --upgrade intelhex
        pip install --upgrade platformio
        pip install intelhex
    - name: Prepare config
      run: |
        cp "SRC/ShineWiFi-ModBus/Config.h.example" "SRC/ShineWiFi-ModBus/Config.h"
    - name: Run PlatformIO
      run: pio run -e ShineWifiX -e ShineWifiS -e lolin32 -e nodemcu-32s -e d1
    - name: Adjust firmware filename
      run: |
        mkdir -p release
        if [ -f .pio/build/lolin32/firmware.bin ]; then mv .pio/build/lolin32/firmware.bin release/firmware-lolin32.bin; fi
        if [ -f .pio/build/ShineWiFiX/firmware.bin ]; then mv .pio/build/ShineWiFiX/firmware.bin release/firmware-ShineWiFiX.bin; fi
        if [ -f .pio/build/ShineWiFiS/firmware.bin ]; then mv .pio/build/ShineWiFiS/firmware.bin release/firmware-ShineWiFiS.bin; fi
        if [ -f .pio/build/nodemcu-32s/firmware.bin ]; then mv .pio/build/nodemcu-32s/firmware.bin release/firmware-nodemcu-32s.bin; fi
        if [ -f .pio/build/d1/firmware.bin ]; then mv .pio/build/d1/firmware.bin release/firmware-d1.bin; fi
    - name: Prepare config for TLXH inverters
      run: |
        sed -i -e "s/GROWATT_MODBUS_VERSION 124/GROWATT_MODBUS_VERSION 3000/g" "SRC/ShineWiFi-ModBus/Config.h"
    - name: Run PlatformIO for TLXH inverters
      run: pio run -e ShineWifiX -e lolin32 -e nodemcu-32s -e d1
    - name: Adjust firmware filename for TLXH inverters
      run: |
        for f in .pio/build/*/firmware.bin; do
          if [ -f "$f" ]; then
            dir=$(dirname "$f")
            target=$(basename "$dir")
            mv "$f" "release/firmware-${target}-TLXH.bin"
          fi
        done
    - name: Upload firmware artifacts
      uses: actions/upload-artifact@v4
      with:
        name: firmware-binaries
        path: release/*.bin
    - name: Release
      uses: fnkr/github-action-ghr@v1
      if: startsWith(github.ref, 'refs/tags/')
      env:
        GHR_PATH: release/
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
